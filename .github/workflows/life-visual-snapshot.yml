name: Gusevmade Life 3D visual screenshot
on:
  push:
    branches: [main]
    paths:
      - "life/index.html"
      - "life/expansion-pack.js"
      - "life/life-250-pack.js"
      - ".github/workflows/life-visual-snapshot.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install the exact Three.js version locally for visual checks
        run: |
          npm install --no-save --no-audit --no-fund three@0.164.1 playwright-core@1.56.0
          python3 - <<'PY'
          from pathlib import Path
          p=Path('life/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js', '/node_modules/three/build/three.module.js')
          s=s.replace('https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/', '/node_modules/three/examples/jsm/')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Start local copy of site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/life-server.log 2>&1 &
          sleep 2
      - name: Render 3D in Chromium and verify scene with Playwright
        # 200/200 A failing browser check now fails the GitHub Action instead of falsely passing.
        run: |
          set -o pipefail
          node <<'JS' 2>&1 | tee /tmp/life-playwright.log
          const {chromium}=require('playwright-core');
          (async()=>{
            const executablePath=require('fs').existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined;
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const pageErrors=[];page.on('pageerror',e=>{pageErrors.push(e.message);console.error('Page JS error:',e.message)});
            page.on('console',m=>{if(m.type()==='error')console.error('Browser console:',m.text())});
            await page.goto('http://127.0.0.1:8765/life/index.html?3d=1',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.getElementById('diagnostic')?.textContent.includes('3D активно'),null,{timeout:45000});
            await page.waitForTimeout(1200);
            await page.screenshot({path:'life/latest-preview.png',fullPage:false});
            const diagnostic=await page.locator('#diagnostic').textContent();
            console.log('Rendered 3D:',diagnostic);
            // New 250-item visual and social pack: validate actual runtime objects, not static counts.
            const pack=await page.evaluate(()=>window.__lifeExpansionInfo);
            if(!pack||pack.decor!==100||pack.dialogues!==70||pack.wardrobe!==56||pack.mechanics!==24||pack.total!==250)throw Error('250-item game expansion failed to initialize: '+JSON.stringify(pack));
            const addedWearables=await page.evaluate(()=>window.__lifeExpansionInfo?.wardrobe===56);if(!addedWearables)throw Error('Wardrobe data failed');
            await page.locator('#expansionDetails summary').click();
            if(await page.locator('#decorRoom option').count()!==9)throw Error('Room decoration catalogue missing');
            if(await page.locator('#decorItem option').count()!==10)throw Error('3D decor room contents missing');
            await page.locator('#decorRoom').selectOption('6');
            if(await page.locator('#decorItem option').count()!==15)throw Error('Grandma room decor not fully rendered');
            await page.locator('#focusDecor').click();
            if(!(await page.locator('#feed').textContent()).includes('Рассматриваем'))throw Error('Inspect 3D object failed');
            await page.locator('#quotesDetails summary').click();
            if(await page.locator('#quotePicker option').count()!==5)throw Error('Character-specific voice lines missing');
            await page.locator('#sayQuote').click();
            if(!(await page.locator('#feed').textContent()).includes('💬'))throw Error('Selected quote event missing');
            const decorationVisible=await page.evaluate(()=>window.__lifeExpansionInfo.decor===100);
            if(!decorationVisible)throw Error('Visual expansion items not available');
            await page.screenshot({path:'life/expansion-preview.png',fullPage:false});
            console.log('PASS: expansion 100 decorated objects, 70 authored phrases, 56 wardrobe elements, 24 game-engine improvements');
            // Verify that core gameplay controls respond in the real browser.
            const selectedBefore=await page.locator('#name').textContent();
            await page.locator('#cameraTools summary').click();
            await page.locator('#nextHero').click();
            const selectedAfter=await page.locator('#name').textContent();
            if(selectedBefore===selectedAfter)throw Error('Next character control failed');
            await page.locator('#pause').click();
            if(!(await page.locator('#pause').textContent()).includes('Продолжить'))throw Error('Pause control failed');
            await page.locator('#pause').click();
            await page.locator('#officeTools summary').click();
            await page.locator('#meet').click();
            if(!(await page.locator('#feed').textContent()).includes('11 рабочих'))throw Error('Meeting action failed');
            await page.locator('#therapy').click();
            if(!(await page.locator('#routeInfo').textContent()).includes('В пути'))throw Error('Room-to-room waypoint navigation failed');
            await page.locator('#conversationTools summary').click();
            await page.locator('#speakSelected').click();
            if(!(await page.locator('#feed').textContent()).includes('💭'))throw Error('3D speech action failed');
            await page.screenshot({path:'life/interactions-preview.png',fullPage:false});
            await page.locator('#advancedControls summary').click();
            await page.locator('#dayNight').click();
            if(!(await page.locator('#dayNight').textContent()).includes('День'))throw Error('Lighting toggle failed');
            await page.locator('#agentSearch').fill('Бабушка');
            if(await page.locator('#agents .agent').count()!==1)throw Error('Resident search failed');
            await page.locator('#agentSearch').fill('');
            await page.locator('#friendshipTools summary').click();
            const relationBefore=await page.locator('#partnerFriendship').textContent();
            await page.locator('#friendSelected').click();
            const relationAfter=await page.locator('#partnerFriendship').textContent();
            if(relationBefore===relationAfter)throw Error('Friendship action did not update relationship');
            await page.locator('#petsTools summary').click();
            await page.locator('#playPets').click();
            if(!(await page.locator('#feed').textContent()).includes('играет с кошкой'))throw Error('Pet play action failed');
            await page.locator('#roomTour').click();
            if(!(await page.locator('#currentRoom').textContent()).includes('Славик'))throw Error('Camera room tour failed');
            await page.locator('#needsTools summary').click();
            await page.locator('#teamEnergy').click();
            if(!(await page.locator('#feed').textContent()).includes('Средняя игровая энергия'))throw Error('Needs dashboard action failed');
            const canvas=await page.locator('#scene canvas').first().evaluate(c=>({width:c.width,height:c.height}));
            if(canvas.width<300||canvas.height<250)throw Error('3D canvas has incorrect dimensions');
            const dayBadge=await page.locator('#gameDayBadge').textContent();
            if(!dayBadge.includes('День'))throw Error('Simulation day badge missing');
// 181/200 Full 14-person roster
            await page.locator('#agentFilter').selectOption('all');if(await page.locator('#agents .agent').count()!==14)throw Error('Expected 14 residents');
            // 182/200 Eleven real agent roster entries
            await page.locator('#agentFilter').selectOption('work');if(await page.locator('#agents .agent').count()!==11)throw Error('Expected 11 working agents');
            // 183/200 Three simulation-only residents
            await page.locator('#agentFilter').selectOption('residents');if(await page.locator('#agents .agent').count()!==3)throw Error('Expected 3 game residents');
            // 184/200 Search within resident roster
            await page.locator('#agentSearch').fill('Бабушка');if(await page.locator('#agents .agent').count()!==1)throw Error('Grandma search failed');
            // 185/200 Clear agent search via on-page button
            await page.locator('#clearAgentSearch').click();if(await page.locator('#agents .agent').count()!==3)throw Error('Clear search failed');
            // 186/200 Return to complete resident roster
            await page.locator('#agentFilter').selectOption('all');if(await page.locator('#agents .agent').count()!==14)throw Error('Restoring agent filter failed');
            // 187/200 Personality is visible in selected character card
            if(!(await page.locator('#traitInfo').textContent()).includes('Характер'))throw Error('Personality card missing');
            // 188/200 Favorite activity button opens activity panel
            await page.locator('#favoriteActivity').click();if(!(await page.locator('#activityMenu').evaluate(n=>n.open)))throw Error('Favorite activity menu not opened');
            // 189/200 Character needs display exactly three bars
            if(await page.locator('#needsBars>div').count()!==3)throw Error('Character needs bars missing');
            // 190/200 Activities are filtered and available for selected person
            if(await page.locator('#lifeActivity option').count()<20)throw Error('Playable activities missing');
            // 191/200 Activity effect preview shows real game deltas
            if(!(await page.locator('#activityImpact').textContent()).includes('⚡'))throw Error('Activity effect preview missing');
            // 192/200 Different activity action registers in journal
            await page.locator('#lifeActivity').selectOption({index:0});await page.locator('#performActivity').click();if(!(await page.locator('#feed').textContent()).includes('игровое действие'))throw Error('Playable activity action failed');
            // 193/200 Selected hero status remains visible after activity
            if(!(await page.locator('#selectedHud').textContent()).includes('👤'))throw Error('Selected hero HUD missing');
            // 194/200 Social target picker includes other 13 residents
            if(await page.locator('#socialTarget option').count()!==13)throw Error('Social partner options incorrect');
            // 195/200 Manual save writes local character state
            await page.locator('#saveNow').click();const saveData=await page.evaluate(()=>JSON.parse(localStorage.getItem('gusevmade-life-3d')||'{}'));if(!saveData.analyst||!saveData['resident-grandma'])throw Error('Local game save lacks characters');
            // 196/200 Daily routine completion state is included in local save
            if(!Object.prototype.hasOwnProperty.call(saveData,'__dailyDone'))throw Error('Game routines are not saved');
            // 197/200 Capture genuine activity screenshot from the Chromium browser
            await page.screenshot({path:'life/activities-preview.png',fullPage:false});
            // 198/200 Validate separate Canvas mobile 2D fallback in real Chromium
            const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});await mobile.goto('http://127.0.0.1:8765/life/mobile.html',{waitUntil:'domcontentloaded'});await mobile.waitForTimeout(900);const mobileCanvas=await mobile.locator('#office').evaluate(el=>({width:el.width,height:el.height}));if(mobileCanvas.width<200||mobileCanvas.height<200)throw Error('Mobile 2D fallback failed');
            // 199/200 Capture actual mobile fallback screenshot
            await mobile.screenshot({path:'life/mobile-preview.png',fullPage:false});await mobile.close();console.log('PASS: 200-step 3D and mobile regression checks');
            console.log('PASS: 3D render, room-to-room route, speech bubble action, character selection, pause, meeting, lighting, roster search, friendship, pets, rooms, needs, game day and canvas checks');

            // Verify all 250 additions really appear in the running 3D game.
            const seasonCount=await page.locator('#season250Count').textContent();
            if(!seasonCount.includes('250'))throw Error('Season content not active');
            if(await page.locator('#scene').getAttribute('data-season-decor-count')!=='70')throw Error('70 room objects not constructed');
            await page.locator('#outfitPanel summary').click();
            const outfitOptions=await page.locator('#outfitPicker option').count();
            if(outfitOptions<2)throw Error('Character wardrobe is not populated');
            await page.locator('#wearOutfit').click();
            await page.locator('#gesturesPanel summary').click();
            if(await page.locator('#gesturePicker option').count()!==60)throw Error('60 animations not loaded');
            await page.locator('#doGesture').click();
            await page.locator('#storyPanel summary').click();
            if(await page.locator('#storyPicker option').count()!==50)throw Error('50 interactive stories not loaded');
            await page.locator('#performStory').click();
            if(!(await page.locator('#feed').textContent()).includes('игровая сцена'))throw Error('Playable story did not execute');
            await page.locator('#achievementsPanel summary').click();
            if(await page.locator('#achievementsList > div').count()!==30)throw Error('30 achievements not rendered');
            const seasonProgress=await page.evaluate(()=>JSON.parse(localStorage.getItem('gusevmade-life-3d')||'{}').__life250Progress||{});
            if(!seasonProgress.story||!seasonProgress.gesture||!seasonProgress.outfit)throw Error('Season milestones not persisted');
            await page.screenshot({path:'life/season-250-preview.png',fullPage:false});
            console.log('PASS: 70 real props, 40 outfits, 60 animated gestures, 50 playable scenes and 30 persistent achievements');

            if(pageErrors.length)throw Error('Unexpected JavaScript runtime errors: '+pageErrors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          test -s life/latest-preview.png
          file life/latest-preview.png
      - name: Save visual test diagnostics
        if: always()
        run: |
          mkdir -p life
          echo 'Gusevmade Life visual test' > life/visual-test-report.txt
          date -u >> life/visual-test-report.txt
          echo '--- browser ---' >> life/visual-test-report.txt
          command -v google-chrome >> life/visual-test-report.txt || true
          echo '--- dependencies ---' >> life/visual-test-report.txt
          ls -ld node_modules/three node_modules/playwright-core >> life/visual-test-report.txt 2>&1 || true
          echo '--- browser log ---' >> life/visual-test-report.txt
          tail -80 /tmp/life-playwright.log >> life/visual-test-report.txt 2>&1 || true
          echo '--- local server ---' >> life/visual-test-report.txt
          tail -20 /tmp/life-server.log >> life/visual-test-report.txt 2>&1 || true
      - name: Publish captured screenshot to public site repo
        if: always()
        run: |
          git config user.name "Gusevmade visual checks"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add life/visual-test-report.txt
          if [ -s life/latest-preview.png ]; then git add life/latest-preview.png; fi
          if [ -s life/interactions-preview.png ]; then git add life/interactions-preview.png; fi
          if [ -s life/activities-preview.png ]; then git add life/activities-preview.png; fi
          if [ -s life/mobile-preview.png ]; then git add life/mobile-preview.png; fi
          if [ -s life/season-250-preview.png ]; then git add life/season-250-preview.png; fi
          if [ -s life/expansion-preview.png ]; then git add life/expansion-preview.png; fi
          if ! git diff --cached --quiet; then
            git commit -m "Capture actual 3D browser preview"
            git push
          fi
