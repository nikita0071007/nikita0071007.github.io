name: Gusevmade Life 3D visual screenshot
on:
  push:
    branches: [main]
    paths:
      - "life/index.html"
      - ".github/workflows/life-visual-snapshot.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install the exact Three.js version locally for visual checks
        run: |
          npm install --no-save --no-audit --no-fund three@0.164.1 playwright-core@1.56.0
          python3 - <<'PY'
          from pathlib import Path
          p=Path('life/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js', '/node_modules/three/build/three.module.js')
          s=s.replace('https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/', '/node_modules/three/examples/jsm/')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Start local copy of site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/life-server.log 2>&1 &
          sleep 2
      - name: Render 3D in Chromium and verify scene with Playwright
        continue-on-error: true
        run: |
          set -o pipefail
          node <<'JS' 2>&1 | tee /tmp/life-playwright.log
          const {chromium}=require('playwright-core');
          (async()=>{
            const executablePath=require('fs').existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined;
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const pageErrors=[];page.on('pageerror',e=>{pageErrors.push(e.message);console.error('Page JS error:',e.message)});
            page.on('console',m=>{if(m.type()==='error')console.error('Browser console:',m.text())});
            await page.goto('http://127.0.0.1:8765/life/index.html?3d=1',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.getElementById('diagnostic')?.textContent.includes('3D активно'),null,{timeout:45000});
            await page.waitForTimeout(1200);
            await page.screenshot({path:'life/latest-preview.png',fullPage:false});
            const diagnostic=await page.locator('#diagnostic').textContent();
            console.log('Rendered 3D:',diagnostic);
            // Verify that core gameplay controls respond in the real browser.
            const selectedBefore=await page.locator('#name').textContent();
            await page.locator('#cameraTools summary').click();
            await page.locator('#nextHero').click();
            const selectedAfter=await page.locator('#name').textContent();
            if(selectedBefore===selectedAfter)throw Error('Next character control failed');
            await page.locator('#pause').click();
            if(!(await page.locator('#pause').textContent()).includes('Продолжить'))throw Error('Pause control failed');
            await page.locator('#pause').click();
            await page.locator('#officeTools summary').click();
            await page.locator('#meet').click();
            if(!(await page.locator('#feed').textContent()).includes('11 рабочих'))throw Error('Meeting action failed');
            await page.locator('#therapy').click();
            if(!(await page.locator('#routeInfo').textContent()).includes('В пути'))throw Error('Room-to-room waypoint navigation failed');
            await page.locator('#conversationTools summary').click();
            await page.locator('#speakSelected').click();
            if(!(await page.locator('#feed').textContent()).includes('💭'))throw Error('3D speech action failed');
            await page.screenshot({path:'life/interactions-preview.png',fullPage:false});
            await page.locator('#advancedControls summary').click();
            await page.locator('#dayNight').click();
            if(!(await page.locator('#dayNight').textContent()).includes('День'))throw Error('Lighting toggle failed');
            await page.locator('#agentSearch').fill('Бабушка');
            if(await page.locator('#agents .agent').count()!==1)throw Error('Resident search failed');
            await page.locator('#agentSearch').fill('');
            await page.locator('#friendshipTools summary').click();
            const relationBefore=await page.locator('#partnerFriendship').textContent();
            await page.locator('#friendSelected').click();
            const relationAfter=await page.locator('#partnerFriendship').textContent();
            if(relationBefore===relationAfter)throw Error('Friendship action did not update relationship');
            await page.locator('#petsTools summary').click();
            await page.locator('#playPets').click();
            if(!(await page.locator('#feed').textContent()).includes('играет с кошкой'))throw Error('Pet play action failed');
            await page.locator('#roomTour').click();
            if(!(await page.locator('#currentRoom').textContent()).includes('Славик'))throw Error('Camera room tour failed');
            await page.locator('#needsTools summary').click();
            await page.locator('#teamEnergy').click();
            if(!(await page.locator('#feed').textContent()).includes('Средняя игровая энергия'))throw Error('Needs dashboard action failed');
            const canvas=await page.locator('#scene canvas').first().evaluate(c=>({width:c.width,height:c.height}));
            if(canvas.width<300||canvas.height<250)throw Error('3D canvas has incorrect dimensions');
            const dayBadge=await page.locator('#gameDayBadge').textContent();
            if(!dayBadge.includes('День'))throw Error('Simulation day badge missing');
            console.log('PASS: 3D render, room-to-room route, speech bubble action, character selection, pause, meeting, lighting, roster search, friendship, pets, rooms, needs, game day and canvas checks');
            if(pageErrors.length)throw Error('Unexpected JavaScript runtime errors: '+pageErrors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          test -s life/latest-preview.png
          file life/latest-preview.png
      - name: Save visual test diagnostics
        if: always()
        run: |
          mkdir -p life
          echo 'Gusevmade Life visual test' > life/visual-test-report.txt
          date -u >> life/visual-test-report.txt
          echo '--- browser ---' >> life/visual-test-report.txt
          command -v google-chrome >> life/visual-test-report.txt || true
          echo '--- dependencies ---' >> life/visual-test-report.txt
          ls -ld node_modules/three node_modules/playwright-core >> life/visual-test-report.txt 2>&1 || true
          echo '--- browser log ---' >> life/visual-test-report.txt
          tail -80 /tmp/life-playwright.log >> life/visual-test-report.txt 2>&1 || true
          echo '--- local server ---' >> life/visual-test-report.txt
          tail -20 /tmp/life-server.log >> life/visual-test-report.txt 2>&1 || true
      - name: Publish captured screenshot to public site repo
        if: always()
        run: |
          git config user.name "Gusevmade visual checks"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add life/visual-test-report.txt
          if [ -s life/latest-preview.png ]; then git add life/latest-preview.png; fi
          if [ -s life/interactions-preview.png ]; then git add life/interactions-preview.png; fi
          if ! git diff --cached --quiet; then
            git commit -m "Capture actual 3D browser preview"
            git push
          fi
