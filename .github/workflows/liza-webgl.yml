name: Mountain villa rooms WebGL checks
on:
  push:
    branches: [verify/liza-webgl]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund three@0.160.1 playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Exercise rooms, kitchen, garden and terrace
        run: |
          mkdir -p life-qa
          curl -fsSL --max-time 25 https://raw.githubusercontent.com/nikita0071007/office/main/status.json -o life-qa/status.json
          node --test tests/*.test.*
          node qa/check-rooms.mjs
          node qa/villa-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mountain-villa-evidence
          path: |
            life-qa/villa-*.png
            life-qa/office-security.png
            life-qa/office-editorial.png
          if-no-files-found: ignore
          retention-days: 14
