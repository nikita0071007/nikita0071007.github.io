<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gusevmade Life — мобильный офис</title><style>*{box-sizing:border-box}body{margin:0;background:#101c2d;color:#f1f7ff;font:15px system-ui}header{padding:15px;background:#1d3047}h1{margin:0 0 7px;font-size:22px}header p{margin:0;color:#bfd1df}#office{display:block;width:100%;height:53vh;min-height:340px;background:#2c465a;touch-action:manipulation}section{padding:14px}button{background:#355b80;color:#fff;border:1px solid #6686a1;border-radius:9px;padding:10px;margin:2px;font:inherit}#agents{display:flex;overflow:auto;gap:6px;padding:10px 0}#agents button{flex:none}#info{line-height:1.7}#feed{font-size:13px;color:#c5d6e5;max-height:120px;overflow:auto}small{color:#a6bdcf}</style></head><body><header><h1>🏙️ Gusevmade Life</h1><p>⚖️ Баланс · 11 сотрудников · мобильный офис</p></header><canvas id="office"></canvas><section><button id="pause">⏸ Пауза</button><button id="talk">💬 Разговор</button><button id="meet">👥 Встреча</button><h3 id="title">Аня · Аналитик</h3><div id="info"></div><div id="agents"></div><h3>Отношения и настроение</h3><div id="social"></div><h3>Жизнь офиса</h3><div id="feed"></div><small>Это мобильная 2D-версия. Работа агентов читается из GitHub, разговоры и отношения — симуляция.</small></section><script>
(function(){
const names=[['analyst','Аня','Аналитик'],['poster','Макс','Посты'],['guard','Славик','Контроль'],['editor','Артём','Монтаж'],['video','Лена','Видео'],['critic','Юрий','Редактор'],['coach','Игорь','Наставник'],['community','Маша','Сообщество'],['archivist','Вера','Архив'],['producer','Олег','Продюсер'],['orders','Дима','Заказы']];
const canvas=document.getElementById('office'),c=canvas.getContext('2d'),people=names.map((n,i)=>({id:n[0],name:n[1],role:n[2],x:2+(i%4)*4.5,y:3+Math.floor(i/4)*4.2,tx:2+(i%4)*4.5,ty:3+Math.floor(i/4)*4.2,energy:75+i%4*5,social:60,task:'Загрузка...',status:'',relation:{}}));let chosen=0,paused=false,last=0,elapsed=0;let relations={};try{relations=JSON.parse(localStorage.getItem('gusevmade-mobile-relations')||'{}')}catch{};function saveRelations(){try{localStorage.setItem('gusevmade-mobile-relations',JSON.stringify(relations))}catch{}}function pair(a,b){return [a.id,b.id].sort().join(':')}
function resize(){let r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*Math.min(devicePixelRatio,2));canvas.height=Math.round(r.height*Math.min(devicePixelRatio,2));draw()}addEventListener('resize',resize);
function draw(){let w=canvas.width,h=canvas.height;c.fillStyle='#293f53';c.fillRect(0,0,w,h);let sc=Math.min(w/24,h/18),ox=(w-22*sc)/2,oy=(h-16*sc)/2;const pos=(x,y)=>[ox+x*sc,oy+y*sc];c.fillStyle='#486578';c.fillRect(ox,oy,22*sc,16*sc);c.strokeStyle='#9eb8c6';c.lineWidth=2;c.strokeRect(ox,oy,22*sc,16*sc);for(let i=0;i<11;i++){let x=1+(i%4)*5.2,y=1+Math.floor(i/4)*5;let p=pos(x,y);c.fillStyle='#a88661';c.fillRect(p[0],p[1],3.1*sc,1.4*sc);c.fillStyle='#243b4d';c.fillRect(p[0]+sc,p[1]+.15*sc,1.1*sc,.5*sc)}for(let i=0;i<people.length;i++){let p=people[i],q=pos(p.x,p.y);c.beginPath();c.fillStyle=i===chosen?'#ffd568':'#8dd7f5';c.arc(q[0],q[1],Math.max(6,.34*sc),0,Math.PI*2);c.fill();c.strokeStyle='#182c3a';c.lineWidth=2;c.stroke();c.font='bold '+Math.max(10,.45*sc)+'px system-ui';c.fillStyle='white';c.textAlign='center';c.fillText(p.name,q[0],q[1]-11)}c.textAlign='left';c.font='bold '+Math.max(12,.5*sc)+'px system-ui';c.fillStyle='#fff';c.fillText('Офис · сотрудники онлайн',ox+8,oy+20)}
function info(){let p=people[chosen];document.getElementById('title').textContent=p.name+' · '+p.role;document.getElementById('info').textContent='Энергия '+Math.round(p.energy)+'% · Общение '+Math.round(p.social)+'% · '+p.status+' · Задача: '+p.task;let friends=people.filter(x=>x!==p).map(x=>({name:x.name,v:relations[pair(p,x)]||20})).sort((a,b)=>b.v-a.v).slice(0,3);document.getElementById('social').textContent='Ближе всего: '+friends.map(x=>x.name+' '+x.v+'% '+(x.v>=75?'❤️':x.v>=45?'🤝':'')).join(' · ')}
function list(){let d=document.getElementById('agents');d.replaceChildren();people.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p.name;b.style.background=i===chosen?'#8b6541':'#355b80';b.onclick=()=>{chosen=i;info();list();draw()};d.appendChild(b)})}
function log(t){let p=document.createElement('p');p.textContent=t;document.getElementById('feed').prepend(p)}
function talk(){let a=people[Math.floor(Math.random()*people.length)],b=people[Math.floor(Math.random()*people.length)];if(a===b)b=people[(people.indexOf(a)+1)%people.length];a.tx=Math.min(20,b.x+1);a.ty=b.y;a.social=Math.min(100,a.social+10);b.social=Math.min(100,b.social+6);let k=pair(a,b);relations[k]=Math.min(100,(relations[k]||20)+5);saveRelations();let phrase=relations[k]>=75?['Мне нравится проводить с тобой время ❤️','Пойдём на свидание? 💗','Ты сегодня прекрасно выглядишь!'][Math.floor(Math.random()*3)]:['Как дела?','Пойдём пить кофе?','Рад тебя видеть!','Давай обсудим идеи.'][Math.floor(Math.random()*4)];log(a.name+' → '+b.name+': «'+phrase+'»');info()}
document.getElementById('talk').onclick=talk;document.getElementById('meet').onclick=()=>{people.forEach((p,i)=>{p.tx=8+(i%4)*1.5;p.ty=10+Math.floor(i/4)*1.2});log('Команда собирается на встречу')};document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ Продолжить':'⏸ Пауза'};
canvas.onclick=e=>{let r=canvas.getBoundingClientRect(),sc=Math.min(canvas.width/24,canvas.height/18),ox=(canvas.width-22*sc)/2,oy=(canvas.height-16*sc)/2,x=(e.offsetX*canvas.width/r.width-ox)/sc,y=(e.offsetY*canvas.height/r.height-oy)/sc;let nearest=0,dist=Infinity;people.forEach((p,i)=>{let d=(p.x-x)**2+(p.y-y)**2;if(d<dist){dist=d;nearest=i}});chosen=nearest;info();list();draw()};
function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(!paused){elapsed+=dt;for(let p of people){let dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d>.06){p.x+=dx/d*Math.min(d,dt*1.2);p.y+=dy/d*Math.min(d,dt*1.2)}else if(Math.random()<.002){p.tx=1+Math.random()*19;p.ty=2+Math.random()*12}p.energy=Math.max(20,p.energy-dt*.015);p.social=Math.max(15,p.social-dt*.01)}if(elapsed>15){elapsed=0;talk()}}draw();requestAnimationFrame(frame)}
async function status(){try{let r=await fetch('https://raw.githubusercontent.com/nikita0071007/office/main/status.json?ts='+Date.now()),j=await r.json();for(let p of people){let a=j.agents?.[p.id];if(a){p.task=a.task||'Без задачи';p.status=a.status||''}}info()}catch{log('Статусы временно недоступны')}}resize();list();info();log('Мобильный офис запущен');status();setInterval(status,120000);requestAnimationFrame(frame);
})();
</script></body></html>
